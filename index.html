<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de salas CIPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="divHeader">
            <div class="imagemLogo">
                <img src="images/logo_cips.png" alt="Logo CIPS">
            </div>
            <h1>Agendamento de salas</h1>
        </div>
    </header>

    <main>
        <div class="container">
            <h2 class="mb-4">Acesse sua conta</h2>
            
            <form action="php/login.php" method="POST">
                <div class="mb-3 text-start">
                    <label for="email" class="formFont">E-mail:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope textCips"></i></span>
                        <input type="email" id="email" name="email" class="form-control border-start-0" placeholder="seuemail@exemplo.com" required>
                    </div>
                </div>
                <div class="mb-4 text-start">
                    <label for="senha" class="formFont">Senha:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock-fill textCips"></i></span>
                        <input type="password" id="senha" name="senha" class="form-control border-start-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="button w-100">Login</button>
            </form>

            <div class="mt-5 d-flex flex-column align-items-center gap-3">
                <a href="html/esqueci_senha.html" class="linkCadastro py-1 px-2">Esqueci minha senha</a> 
                <a href="html/cadastro.html" class="linkCadastro py-1 px-2">Ainda não tem conta? Cadastre-se</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="divFooter">
            <p class="mb-0">Desenvolvido por Renan Albino Horne (<a href="https://github.com/RenanHornet" target="_blank" class="linkGit"><i class="bi bi-github"></i>GitHub</a>)</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
