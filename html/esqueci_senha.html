<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Agendamento CIPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header>    
        <div class="divHeader">
            <div class="imagemLogo">
                <img src="../images/logo_cips.png" alt="Logo CIPS">
            </div>
            <h1>Agendamento de salas</h1>
        </div>
    </header>

    <main class="container-fluid flex-grow-1 d-flex justify-content-center align-items-center py-4">
        <div class="container" style="max-width: 420px;">
            <h2 class="mb-3">Redefinir Senha</h2>
            <p class="text-muted small mb-4">Informe o seu e-mail cadastrado e digite a nova senha.</p>

            <form action="../php/redefinir_senha.php" method="POST">
                
                <div class="mb-3 text-start">
                    <label for="email" class="formFont">E-mail Cadastrado:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope-fill textCips"></i></span>
                        <input type="email" id="email" name="email" class="form-control border-start-0" placeholder="seuemail@cips.com" required>
                    </div>
                </div>

                <div class="mb-3 text-start">
                    <label for="nova_senha" class="formFont">Nova Senha:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock-fill textCips"></i></span>
                        <input type="password" id="nova_senha" name="nova_senha" class="form-control border-start-0" placeholder="Digite a nova senha" required>
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label for="confirmar_senha" class="formFont">Confirmar Nova Senha:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield-lock-fill textCips"></i></span>
                        <input type="password" id="confirmar_senha" name="confirmar_senha" class="form-control border-start-0" placeholder="Repita a nova senha" required>
                    </div>
                </div>

                <button type="submit" class="button w-100 mb-3">Atualizar Senha</button>
            </form>

            <a href="../index.html" class="linkCadastro"><i class="bi bi-arrow-left"></i> Voltar para o Login</a>
        </div>
    </main>

    <footer>
        <div class="divFooter">
            <p class="mb-0">Desenvolvido por Renan Albino Horne (<a href="https://github.com/RenanHornet" target="_blank" class="linkGit"><i class="bi bi-github"></i>GitHub</a>)</p>
        </div>    
    </footer>

</body>
</html>
